name: Benecafe Monitor

on:
  schedule:
    # 1시간마다 실행 (매시 정각)
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      TZ: 'Asia/Seoul'

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 의존성 설치
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: 모니터링 스크립트 실행
        env:
          BENECAFE_ID: ${{ secrets.BENECAFE_ID }}
          BENECAFE_PW: ${{ secrets.BENECAFE_PW }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: 데이터 변경 및 상태 저장
        run: |
          git config --global user.name "Benecafe Bot"
          git config --global user.email "bot@noreply.github.com"
          
          # 파일 변경 여부 확인 (monitor.py 실행으로 json 파일들이 변경되었는지)
          if [[ -n $(git status -s) ]]; then
            echo "변경 사항(데이터 또는 상태값)이 있어 커밋합니다."
            git add .
            git commit -m "Update monitor data/status: $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          else
            echo "변경 사항 없음."
            
            # Keepalive (50일 미사용 방지)
            LAST_COMMIT=$(git log -1 --format=%ct)
            NOW=$(date +%s)
            DIFF=$((NOW - LAST_COMMIT))
            # 50일 = 4320000초
            if [ $DIFF -ge 4320000 ]; then
              git commit --allow-empty -m "Automated keepalive commit"
              git push
            fi
          fi